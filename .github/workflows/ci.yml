name: CI

# Every branch is checked, so a branch can be proven green before it is merged.
# The server's auto-deploy (deploy/auto-deploy.sh) only deploys a main commit whose
# checks here have all passed.
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Docker image builds
        run: docker build -t juniper-cafe-pos:ci .

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: project_poin
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: project_poin
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /tmp/pos-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Load schema + seed data
        run: mysql -h 127.0.0.1 -uroot -proot project_poin < ../database/project_poin_seeded.sql
      - name: Migrations apply cleanly (and a second run is a no-op)
        run: node src/migrate-cli.js && node src/migrate-cli.js
      - name: API tests
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./test/gh-annotations.js --test-reporter-destination=stdout
          test/*.test.js
      - name: Docker image builds
        run: docker build -t juniper-pos-api:ci .
