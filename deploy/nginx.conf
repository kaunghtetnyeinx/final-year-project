server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Note: nginx drops server-level add_header lines inside any location that sets its own,
    # so the security headers live in a snippet included in each location.

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, so a redeploy reaches every till immediately
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
